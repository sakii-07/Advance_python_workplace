<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update user</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow-lg p-4" style="width: 400px;">
        <h2 class="text-center mb-4 text-primary">Update User</h2>

        <form>

            <!-- Username -->
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input
                    type="text"
                    class="form-control"
                    placeholder="Enter Username" name="uname"
                    value="{{userdb.uname}}">
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input
                    type="password"
                    class="form-control"
                    placeholder="Enter Password" name="password"
                    value="{{userdb.password}}">
            </div>

            <!-- Mobile -->
            <div class="mb-4">
                <label class="form-label">Mobile Number</label>
                <input
                    type="tel"
                    class="form-control"
                    placeholder="Enter Mobile Number" name="mobile"
                    value="{{userdb.mobile}}"
                    maxlength="10">
            </div>

            <!-- Button -->
            <div class="d-grid">
                <button type="submit" class="btn btn-primary m-2" formaction="{% url 'showUserForDelete' %}">
                    Show Details
                </button>
                <button type="submit" class="btn btn-primary m-2" formaction="{% url 'delete' %}">
                    Delete
                </button>
            </div>

            <h5 style="text-align: center; color: green;">{{msg}}</h5>

        </form>

    </div>

</div>

</body>
</html>
