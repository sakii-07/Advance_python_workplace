<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Users</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f7fa;
        }
        .card{
            border:none;
            border-radius:15px;
        }
        .table thead{
            background:#0d6efd;
            color:white;
        }
        h2{
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="container mt-5">

    <div class="card shadow-lg">
        <div class="card-body">

            <h2 class="text-center text-primary mb-4">
                User Details
            </h2>

            <div class="table-responsive">

                <table class="table table-bordered table-hover align-middle text-center">

                    <thead>
                        <tr>
                            <th>Sr. No</th>
                            <th>Username</th>
                            <th>Password</th>
                            <th>Mobile</th>
                            <th>Created At</th>
                        </tr>
                    </thead>

                    <tbody>

                    {% for user in userdb %}
                        <tr>
                            <td>{{ forloop.counter }}</td>
                            <td>{{ user.uname }}</td>
                            <td>{{ user.password }}</td>
                            <td>{{ user.mobile }}</td>
                            <td>{{ user.created_at }}</td>
                        </tr>
                    {% empty %}
                        <tr>
                            <td colspan="4" class="text-danger fw-bold">
                                No Users Found
                            </td>
                        </tr>
                    {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>
    </div>

</div>

</body>
</html>
