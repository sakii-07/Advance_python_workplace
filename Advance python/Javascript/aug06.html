<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Type in JS</title>
</head>
<body>
    
    <script>

        let num1 = 20
        console.log(num1)
        console.log(typeof(num1))

        let str = "sakshi"
        console.log(str)
        console.log(typeof(str))

        let pi
        console.log(pi)
        console.log(typeof(pi))

        let num2 = null
        console.log(num2)
        console.log(typeof(num2))

        let mobile_no = 1234536284654746n  // If we write n at the end of number then it is bigint
        console.log(mobile_no)
        console.log(typeof(mobile_no))


        let b = true
        console.log(b)
        console.log(typeof(b))

        let sy = Symbol(10) // frozenset
        console.log(sy)
        console.log(typeof(sy))


        // Non primitive 
        // 1) array
        // 2) object

        let arr = [10,20,30,40]
        console.log(arr)
        console.log(typeof(arr))
        console.log(arr[2]);
        

        let obj = {
            name : "sakshi",
            city : "pune"
        }
        console.log(obj)
        console.log(typeof(obj))


        // array methods
    /*  1) push
        2) unshift
        3) shift
        4) indexof
        5) slice 
        6) splice 
        7) join
        8) reverse 
        9) includes
        10) sort
        11) concat 
        12) toString 
        13) toSorted
        14) toReversed
        */

        /*
        object methods 
            1) keys
            2) values
            3) entries
            4) hasOwn
        */

        // backticks (`) used for fstring in JS

    </script>

</body>
</html>
