<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Type in JS</title>
</head>
<body>
    
    <script>

        /*
        Datatypes : 
                1) primitive
                2) Non primitive

        1) primitive - stores single value
                1) Number
                2) String
                3) Boolean
                4) Null
                5) Undifined
                6) Symbol
                7) Bigint
        */

        let num1 = 20
        console.log(num1)
        console.log(typeof(num1))

        let str = "sakshi"
        console.log(str)
        console.log(typeof(str))

        let pi
        console.log(pi)
        console.log(typeof(pi))

        let num2 = null
        console.log(num2)
        console.log(typeof(num2))

        let mobile_no = 1234536284654746n  // If we write n at the end of number then it is bigint
        console.log(mobile_no)
        console.log(typeof(mobile_no))


        let b = true
        console.log(b)
        console.log(typeof(b))

        let sy = Symbol(10) // frozenset
        console.log(sy)
        console.log(typeof(sy))


       /*
         Non primitive 
            1) array
            2) object
       */

        let arr = [10,20,30,40]
        console.log(arr)
        console.log(typeof(arr))
        console.log(arr[2]);
        

        let obj = {
            name : "sakshi",
            city : "pune"
        }
        console.log(obj)
        console.log(typeof(obj))


        // array methods
    /*  1) push
        2) unshift
        3) shift
        4) indexof
        5) slice 
        6) splice 
        7) join
        8) reverse 
        9) includes
        10) sort
        11) concat 
        12) toString 
        13) toSorted
        14) toReversed
        */

        let arr1 = [10,20,30,40,50]
        arr1.push(100) // Add element at end 
        console.log(arr1);

        arr1.pop() // Remove last element 
        console.log(arr1); 
        

        arr1.unshift(200) // Add element at beginning
        console.log(arr1);
        
        arr1.shift() // Remove first element 
        console.log(arr1);
        
        console.log(arr1.indexOf(20)); // Find index of element 

        console.log(arr1.includes(25)); // Check if element exists 
        
        console.log(arr1.slice(1,3)); // Extract portion (no change to original) 

        console.log(arr1.join('-')); // Convert array to string 

        console.log(arr1.reverse()); // Reverse order of elements
        
        console.log(arr1.sort()); // Sort elements 
         
        console.log(arr1.concat([23,45,34])); // Merge arrays 

        console.log(arr1.toString()); // Convert array to comma string

        console.log(arr1.toSorted()); // Creates a sorted copy of the array without changing the original. 
        
        console.log(arr1.toReversed()); // Creates a reversed copy of the array without changing the original
        

        /*
        object methods 
            1) keys
            2) values
            3) entries
            4) hasOwn
        */

        // backticks (`) used for fstring in JS

        obj = {
            name : "Sakshi",
            age : 22,
            city : "Solapur"
        }

        console.log(Object.keys(obj));

        console.log(Object.values(obj));

        console.log(Object.entries(obj));

        console.log(Object.hasOwn(obj), "name");
        
        let name = "Supriya"
        let str1 = `hello ${name}`
        console.log(str1);
        

        /* String methods */

        let str2 = "The Kiran Academy"

        console.log(str2.toUpperCase());

        console.log(str2.toLowerCase());

        console.log(str2.trim());

        console.log(str2.slice(1,6));

        console.log(str2.substring(1,6));

        console.log(str2.replace("Kiran","Sakshi"));

        console.log(str2.includes("The"));

        console.log(str2.indexOf('i'));

        console.log(str2.split());

        console.log(str2.concat(["","pune"]));

        console.log(str2.charAt(5));

        // Operators

        num1 = 20
        num2 = 45

        // Arithmetic Operators
        console.log(num1 + num2);
        console.log(num1 - num2);
        console.log(num1 * num2);
        console.log(num1 / num2);
        console.log(num1 % num2);
        console.log(num1 ** num2);
        console.log(num1++);
        console.log(num1--);

        // Assignment Operators 
        console.log(num1 = 1000);
        console.log(num1 += 5);
        console.log(num1 -= 4);
        console.log(num1 *= 3);
        console.log(num1 /= 5);
        console.log(num1 %= 5);

        // Logical Operators

        console.log(num1 > 10 && num2 < 60);

        console.log(num1 < 10 || num2 > 60);

        console.log(!false);
        console.log(100000)

        // Comparison Operators 
        console.log(5 == '5');
        console.log(5 === '5');
        console.log(5 != 3);
        console.log(5 !== '5');
        console.log(5 > 3);
        console.log(5 < 3);
        console.log(5 >= 3);
        console.log(5 <= 3);
        

        // Ternary Operator (Conditional) 
        let age = 18
        let result = age >= 18 ? "Adult" : "Minor"
        console.log(result);
        
        
    </script>

</body>
</html>
