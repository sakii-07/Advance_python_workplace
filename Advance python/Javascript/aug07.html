<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>

    <script>
        // if else stmt
        let num1 = 20
        if (num1 == 0){
            console.log("Zero"); 
        }else if (num1 % 2 == 0){
            console.log("Even");
            
        }else{
            console.log("Odd");
            
        }

        // Switch case
        let num2 = 23
        switch (num2){
            case 1 : 
                console.log("One");
                break
            case 2 : 
                console.log("Two");
                break
            default : 
                console.log("Invalid choice");              
        }

        // For loop
        for(let i = 0;i<10;i++){
            console.log(i);     
        }

        // while loop
        let i = 0
        while(i<5){
            console.log(i*10);
            i++
        }

        // do while
        do{
            console.log(num2);
            
        }while(num2 <=5)
    </script>
    
</body>
</html>
