    <h1 id="head">Heading</h1>
    <button onclick="Demo()">Change Color</button>

    <h2 class="cls">Heading 2</h2>
    <h2 class="cls">Heading 3</h2>

    <a href="www.google.com">Google</a>

    <script>
        function Demo(){
            head = document.getElementById('head')
            head.style.color = "red"
        }
        cls = document.getElementsByClassName('cls')
        cls[0].style.color = "blue"

        a = document.getElementsByTagName('a')
        a[0].style.color = "green"

        create = document.createElement("h4")
        create.innerText = 'This is heading'
        document.body.appendChild(create)

        create.classList.add("heading4")
        console.log(create.getAttribute("class"))
        create.setAttribute("class","heading5")
        console.log(create.getAttribute("class"))
        create.remove()

    </script>
