{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriCare</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm sticky-top">

    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold" href="{% url 'gethomepage' %}">
            🌱 AgriCare
        </a>

        <!-- Mobile Button -->
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbar">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Menu -->
        <div class="collapse navbar-collapse" id="navbar">

            <ul class="navbar-nav mx-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="{% url 'gethomepage' %}">
                        <i class="bi bi-house-door-fill"></i>
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'getshowallproductpage' %}">
                        <i class="bi bi-box-seam"></i>
                        Products
                    </a>
                </li>

                <li class="nav-item dropdown">

                    <a class="nav-link dropdown-toggle"
                       href="#"
                       role="button"
                       data-bs-toggle="dropdown">

                        <i class="bi bi-grid"></i>
                        Categories
                    </a>

                    <ul class="dropdown-menu">

                        <li>
                            <a class="dropdown-item" href="#">
                                🌿 Fertilizers
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item" href="#">
                                🐞 Pesticides
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item" href="#">
                                🌾 Seeds
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item" href="#">
                                🧴 Farming Tools
                            </a>
                        </li>

                    </ul>

                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-info-circle-fill"></i>
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-envelope-fill"></i>
                        Contact
                    </a>
                </li>

            </ul>

            <!-- Search -->
            <form class="d-flex me-3">

                <input class="form-control search-box"
                       type="search"
                       placeholder="Search Products">

                <button class="btn btn-warning ms-2">
                    <i class="bi bi-search"></i>
                </button>

            </form>

        <!-- Update Profile -->
        <a href="{% url 'getuserdetailspage' %}" class="btn btn-warning me-2">
            <i class="bi bi-pencil-square"></i>
             Profile
        </a>

        <!-- Logout -->
        <a href="{% url 'logout' %}" class="btn btn-danger">
            <i class="bi bi-box-arrow-right"></i>
            Logout
        </a>

        </div>

    </div>

</nav>

{%block content%}
{%endblock%}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
