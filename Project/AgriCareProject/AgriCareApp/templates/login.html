{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriCare | Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>

<div class="container">
    <div class="row justify-content-center align-items-center vh-100">

        <div class="col-lg-5 col-md-7 col-sm-10">

            <div class="login-card">

                <div class="text-center mb-4">

                    <div class="logo">
                        🌿
                    </div>

                    <h2 class="fw-bold text-success">AgriCare</h2>

                    <p class="text-muted">
                        Login to continue your farming journey
                    </p>

                </div>

                <form>

                    <!-- Django -->

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>

                        <input
                            type="text"
                            class="form-control"
                            name="username"
                            placeholder="Enter your username"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>

                        <input
                            type="password"
                            class="form-control"
                            name="password"
                            placeholder="Enter your password"
                            required>
                    </div>

                    <div class="d-flex justify-content-between mb-4">

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox">

                            <label class="form-check-label">
                                Remember Me
                            </label>
                        </div>

                        <a href="#" class="link-success text-decoration-none">
                            Forgot Password?
                        </a>

                    </div>

                    <button class="btn btn-success w-100 login-btn" formaction="{% url 'login' %}">
                        Login
                    </button>

                </form>

                <hr>

                <div class="text-center">

                    New User?

                    <a href="{% url 'getsigninpage' %}" class="text-success fw-bold text-decoration-none">
                        Create Account
                    </a>

                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
