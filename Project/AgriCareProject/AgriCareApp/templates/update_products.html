{% extends 'base.html' %}
{% load static %}

{% block content%}

    <title>Add Product | AgriCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{% static 'css/product.css' %}">

</head>

<body>

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-9">

                <div class="card shadow-lg product-card">

                    <div class="card-header bg-success text-white text-center">

                        <h2>
                            Update Product
                        </h2>

                    </div>

                    <div class="card-body p-4">

                        <form enctype="multipart/form-data">

                            <div class="row">

                                <!-- Product Name -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Product Name
                                    </label>

                                    <input type="text"
                                        class="form-control"
                                        name="product_name"
                                        placeholder="Enter Product Name"
                                        value="{{product_db.product_name}}">

                                </div>

                                <!-- Category -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Category
                                    </label>

                                    <select class="form-select"
                                        name="category"
                                        value="{{product_db.category}}"
                                        >

                                        <option value="">Select Category</option>

                                        <option value="Fertilizer">Fertilizer</option>

                                        <option value="Seeds">Seeds</option>

                                        <option value="Pesticides">Pesticides</option>

                                        <option value="Tools">Tools</option>

                                        <option value="Organic Products">Organic Products</option>

                                    </select>

                                </div>

                                <!-- Brand -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Brand
                                    </label>

                                    <input type="text"
                                        class="form-control"
                                        name="brand"
                                        value="{{product_db.brand}}"
                                        placeholder="Brand Name">

                                </div>

                                <!-- Price -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Price
                                    </label>

                                    <input type="number"
                                        class="form-control"
                                        name="price"
                                        value="{{product_db.price}}"
                                        placeholder="Enter Price">

                                </div>

                                <!-- Stock -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Stock
                                    </label>

                                    <input type="number"
                                        class="form-control"
                                        name="stock"
                                        value="{{product_db.stock}}"
                                        placeholder="Available Stock">

                                </div>

                                <!-- Product Image -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Product Image
                                    </label>

                                    <input type="file"
                                        class="form-control"
                                        name="image"
                                        value="{{product_db.image}}">

                                </div>

                                <!-- Manufacturing Date -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Manufacturing Date
                                    </label>

                                    <input type="date"
                                        class="form-control"
                                        name="manufacturing_date"
                                        value="{{product_db.manufacturing_date}}">

                                </div>

                                <!-- Expiry Date -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Expiry Date
                                    </label>

                                    <input type="date"
                                        class="form-control"
                                        name="expiry_date"
                                        value="{{product_db.expiry_date}}">

                                </div>

                                <!-- Description -->

                                <div class="col-12 mb-4">

                                    <label class="form-label">
                                        Description
                                    </label>

                                    <input class="form-control"
                                        rows="5"
                                        name="description"
                                        value="{{product_db.description}}"
                                        placeholder="Write Product Description">

                                </div>

                            </div>

                            <div class="text-center">

                                <button type="submit" class="btn btn-success btn-lg px-5" formaction="{%url 'updateproduct' %}">

                                    <i class="bi bi-check-circle-fill"></i>

                                    Update Product

                                </button>

                                <button type="reset"
                                    class="btn btn-secondary btn-lg px-5 ms-2">

                                    <i class="bi bi-arrow-clockwise"></i>

                                    Reset

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

{%endblock%}
