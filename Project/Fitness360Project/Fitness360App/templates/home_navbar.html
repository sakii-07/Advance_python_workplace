{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness360 Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="{% static 'css/home_navbar.css' %}">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="{% url 'getdashboardpage' %}">
            <i class="fa-solid fa-dumbbell"></i> Fitness360
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav ms-auto align-items-lg-center">

                <li class="nav-item">
                    <a class="nav-link active" href="{% url 'getdashboardpage' %}">
                        <i class="fa-solid fa-house"></i> Home
                    </a>
                </li>

                <!-- Members -->

                <li class="nav-item dropdown">

                    <a class="nav-link dropdown-toggle"
                       href="javascript:void(0)"
                       role="button"
                       data-bs-toggle="dropdown"
                       aria-expanded="false">

                        <i class="fa-solid fa-users"></i> Members

                    </a>

                    <ul class="dropdown-menu">

                        <li>
                            <a class="dropdown-item" href="{% url 'getregisterpage' %}">
                                Register
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item" href="{% url 'showallmembers' %}">
                                View Members
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item" href="{% url 'getmyprofilepage' %}">
                                My Profile
                            </a>
                        </li>

                    </ul>

                </li>

                <!-- Gym -->

                <li class="nav-item dropdown">

                    <a class="nav-link dropdown-toggle"
                       href="javascript:void(0)"
                       role="button"
                       data-bs-toggle="dropdown"
                       aria-expanded="false">

                        <i class="fa-solid fa-dumbbell"></i> Gym

                    </a>

                    <ul class="dropdown-menu">

                        <li>
                            <a class="dropdown-item" href="{% url 'showalltrainers' %}">
                                Trainers
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item" href="{% url 'showallequipmnts' %}">
                                Equipment
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item" href="{% url 'showallattedace' %}">
                                Attendance
                            </a>
                        </li>

                    </ul>

                </li>

                <!-- Payment -->

                <li class="nav-item dropdown">

                    <a class="nav-link dropdown-toggle"
                       href="javascript:void(0)"
                       role="button"
                       data-bs-toggle="dropdown"
                       aria-expanded="false">

                        <i class="fa-solid fa-wallet"></i> Payment

                    </a>

                    <ul class="dropdown-menu">

                        <li>
                            <a class="dropdown-item" href="{% url 'showallpayments' %}">
                                Payments
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item" href="{% url 'showallfeedbacks' %}">
                                Feedback
                            </a>
                        </li>

                    </ul>

                </li>

                <!-- Logout -->

                <li class="nav-item ms-lg-3">

                    <a href="{% url 'logout' %}"
                       class="btn btn-warning rounded-pill px-4">

                        <i class="fa-solid fa-right-from-bracket"></i>
                        Logout

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>

{% block content %}
{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
