{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Members | Fitness360</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/show_members.css' %}">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<div class="container py-5">

    <div class="member-card shadow">

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">

            <h2 class="page-title">
                <i class="fa-solid fa-users"></i>
                Fitness360 Members
            </h2>

            <a href="{% url 'getaddmemberpage' %}" class="btn btn-success">
                <i class="fa-solid fa-user-plus"></i>
                Add Member
            </a>

        </div>

        <div class="mb-3">

            <input type="text"
                   id="searchInput"
                   class="form-control"
                   placeholder="🔍 Search Member...">

        </div>

        <div class="table-responsive">

            <table class="table table-hover align-middle text-center" id="memberTable">

                <thead>

                    <tr>

                        <th>Username</th>
                        <th>Email</th>
                        <th>Mobile</th>
                        <th>Created On</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody>

                    {% for member in members %}

                    <tr>

                        <td>{{ member.username }}</td>

                        <td>{{ member.email }}</td>

                        <td>{{ member.mobile }}</td>

                        <td>{{ member.created_at }}</td>

                        <td>

                            <a href="{% url 'getupdatememberpage' member.username %}"
                               class="btn btn-warning btn-sm">

                                <i class="fa-solid fa-pen"></i>

                            </a>

                            <a href="{% url 'deletemember' member.username %}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Are you sure you want to delete this member?')">

                                <i class="fa-solid fa-trash"></i>

                            </a>

                        </td>

                    </tr>

                    {% empty %}

                    <tr>

                        <td colspan="5" class="text-danger fw-bold">
                            No Members Found
                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

const searchInput=document.getElementById("searchInput");

searchInput.addEventListener("keyup",function(){

let filter=this.value.toLowerCase();

let rows=document.querySelectorAll("#memberTable tbody tr");

rows.forEach(function(row){

let username=row.cells[0].textContent.toLowerCase();

let email=row.cells[1].textContent.toLowerCase();

if(username.includes(filter)||email.includes(filter))
row.style.display="";
else
row.style.display="none";

});

});

</script>

</body>
</html>
