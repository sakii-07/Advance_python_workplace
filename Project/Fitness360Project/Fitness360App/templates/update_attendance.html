{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Attendance | Fitness360</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/update_attendance.css' %}">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card attendance-card shadow-lg">

                <div class="card-header text-center">

                    <i class="fa-solid fa-calendar-check attendance-icon"></i>

                    <h2>Update Attendance</h2>

                    <p>Fitness360 Smart Gym Management System</p>

                </div>

                <div class="card-body">

                    <form action="{% url 'updateattendance' %}" method="post">

                        {% csrf_token %}

                        <input type="hidden"
                               name="attendance_id"
                               value="{{ attendance.attendance_id }}">

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <select class="form-select"
                                    name="username"
                                    required>

                                {% for user in users %}

                                <option value="{{ user.username }}"
                                {% if attendance.username.username == user.username %}selected{% endif %}>

                                    {{ user.username }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Attendance Date
                            </label>

                            <input type="date"
                                   class="form-control"
                                   name="attendance_date"
                                   value="{{ attendance.attendance_date|date:'Y-m-d' }}"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Check In
                            </label>

                            <input type="time"
                                   class="form-control"
                                   name="check_in"
                                   value="{{ attendance.check_in|time:'H:i' }}"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Check Out
                            </label>

                            <input type="time"
                                   class="form-control"
                                   name="check_out"
                                   value="{{ attendance.check_out|time:'H:i' }}"
                                   required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Status
                            </label>

                            <select class="form-select"
                                    name="status"
                                    required>

                                <option value="Present"
                                {% if attendance.status == "Present" %}selected{% endif %}>
                                    Present
                                </option>

                                <option value="Absent"
                                {% if attendance.status == "Absent" %}selected{% endif %}>
                                    Absent
                                </option>

                                <option value="Late"
                                {% if attendance.status == "Late" %}selected{% endif %}>
                                    Late
                                </option>

                            </select>

                        </div>

                        <div class="d-grid gap-2">

                            <button class="btn btn-warning">

                                <i class="fa-solid fa-floppy-disk"></i>

                                Update Attendance

                            </button>

                            <a href="{% url 'showallattedace' %}"
                               class="btn btn-dark">

                                <i class="fa-solid fa-arrow-left"></i>

                                Back

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
