{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Feedback | Fitness360</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/update_feedback.css' %}">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card feedback-card shadow-lg">

                <div class="card-header text-center">

                    <i class="fa-solid fa-star feedback-icon"></i>

                    <h2>Update Feedback</h2>

                    <p>Fitness360 Smart Gym Management System</p>

                </div>

                <div class="card-body">

                    <form action="{% url 'updatefeedback' %}" method="post">

                        {% csrf_token %}

                        <input type="hidden"
                               name="feedback_id"
                               value="{{ feedback.feedback_id }}">

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <select class="form-select"
                                    name="username"
                                    required>

                                {% for user in users %}

                                <option value="{{ user.username }}"
                                {% if feedback.username.username == user.username %}selected{% endif %}>

                                    {{ user.username }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Rating
                            </label>

                            <select class="form-select"
                                    name="rating"
                                    required>

                                <option value="1" {% if feedback.rating == 1 %}selected{% endif %}>⭐ 1</option>
                                <option value="2" {% if feedback.rating == 2 %}selected{% endif %}>⭐⭐ 2</option>
                                <option value="3" {% if feedback.rating == 3 %}selected{% endif %}>⭐⭐⭐ 3</option>
                                <option value="4" {% if feedback.rating == 4 %}selected{% endif %}>⭐⭐⭐⭐ 4</option>
                                <option value="5" {% if feedback.rating == 5 %}selected{% endif %}>⭐⭐⭐⭐⭐ 5</option>

                            </select>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Review
                            </label>

                            <textarea class="form-control"
                                      name="review"
                                      rows="5"
                                      required>{{ feedback.review }}</textarea>

                        </div>

                        <div class="d-grid gap-2">

                            <button class="btn btn-warning">

                                <i class="fa-solid fa-floppy-disk"></i>

                                Update Feedback

                            </button>

                            <a href="{% url 'showallfeedbacks' %}"
                               class="btn btn-dark">

                                <i class="fa-solid fa-arrow-left"></i>

                                Back

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
