{%load static%}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediCart</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{% static 'CSS/about.css' %}">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light custom-navbar shadow-sm">

    <div class="container">

        <!-- Logo -->

        <a class="navbar-brand fw-bold" href="#">

            <div class="logo-box">

                <i class="bi bi-capsule-pill"></i>

            </div>

            <span class="brand-name">

                Medi<span>Cart</span>

            </span>

        </a>

        <!-- Mobile Button -->

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Menu -->

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav mx-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="{% url 'homepage'%}">
                        <i class="bi bi-house-door"></i>
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{%url 'viewmed'%}">
                        <i class="bi bi-capsule"></i>
                        Medicines
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{%url 'categories'%}">
                        <i class="bi bi-grid"></i>
                        Categories
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'gethealthcarepage' %}">
                        <i class="bi bi-heart-pulse"></i>
                        Healthcare
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'getaboutpage'%}">
                        <i class="bi bi-telephone"></i>
                        About
                    </a>
                </li>

            </ul>

            <!-- Right Side -->

            <div class="d-flex align-items-center gap-3">

                <a href="#" class="icon-btn">

                    <i class="bi bi-search"></i>

                </a>

                <a href="#" class="icon-btn">

                    <i class="bi bi-cart3"></i>

                </a>

                <a href="#" class="icon-btn">

                    <i class="bi bi-person-circle"></i>

                </a>

                <a href="{% url 'logout'%}" class="btn btn-login">

                    Logout

                </a>

            </div>

        </div>

    </div>

</nav>

{% block content %}

{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
