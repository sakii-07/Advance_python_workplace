{%load static%}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediCart | Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{% static 'CSS/login.css' %}">

</head>

<body>

<div class="container-fluid">

    <div class="row min-vh-100">

        <!-- Left Section -->

        <div class="col-lg-6 left-section d-flex flex-column justify-content-center align-items-center">

            <div class="logo-circle">

                <div class="logo-inner">

                    <i class="bi bi-capsule-pill logo-pill"></i>

                    <i class="bi bi-plus-lg logo-plus"></i>

                    <i class="bi bi-heart-pulse-fill logo-heart"></i>

                </div>

            </div>

            <h1 class="brand mt-4">

                Medi<span>Cart</span>

            </h1>

            <h4 class="tagline">

                YOUR HEALTH, OUR PRIORITY

            </h4>

            <p class="subtitle">

                Trusted Medicines Delivered To Your Doorstep

            </p>

        </div>

        <!-- Login Section -->

        <div class="col-lg-6 d-flex justify-content-center align-items-center">

            <div class="signup-card">

                <div class="text-center mb-4">

                    <div class="icon-circle">

                        <i class="bi bi-person-circle"></i>

                    </div>

                    <h2>Welcome Back</h2>

                    <p>Sign in to your account</p>

                </div>

                <form>

                    <div class="mb-3">

                        <label>Username</label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-person"></i>

                            </span>

                            <input type="text"
                                   class="form-control"
                                   name="username"
                                   placeholder="Enter Username">

                        </div>

                    </div>

                    <div class="mb-3">

                        <label>Password</label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-lock"></i>

                            </span>

                            <input type="password"
                                   class="form-control"
                                   name = 'password'
                                   placeholder="Enter Password">

                        </div>

                    </div>

                    <div class="d-flex justify-content-between mb-4">

                        <div class="form-check">

                            <input class="form-check-input"
                                   type="checkbox"
                                   id="remember">

                            <label class="form-check-label"
                                   for="remember">

                                Remember Me

                            </label>

                        </div>

                        <a href="#">

                            Forgot Password?

                        </a>

                    </div>

                    <button class="btn signup-btn w-100" formaction="{%url 'login'%}">

                        <i class="bi bi-box-arrow-in-right"></i>

                        Login

                    </button>

                    <p class="text-center mt-4">

                        Don't have an account?

                        <a href="{% url 'getsignuppage'%}">

                            Create Account

                        </a>

                    </p>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
