{%load static%}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCart | Sign Up</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{%static 'CSS/signup.css'%}">
</head>

<body>

    <div class="container-fluid">
        <div class="row min-vh-100">

            <!-- Left Side -->
            <div class="col-lg-6 left-section d-flex flex-column justify-content-center align-items-center">

                <div class="logo-circle">

                    <div class="logo-inner">
                        <i class="bi bi-capsule-pill logo-pill"></i>
                        <i class="bi bi-plus-lg logo-plus"></i>
                        <i class="bi bi-heart-pulse-fill logo-heart"></i>
                    </div>

                </div>

                <h1 class="brand mt-4">
                    Medi<span>Cart</span>
                </h1>

                <h4 class="tagline">
                    YOUR HEALTH, OUR PRIORITY
                </h4>

                <p class="subtitle">
                    Trusted Medicines Delivered To Your Doorstep
                </p>

            </div>

            <!-- Right Side -->

            <div class="col-lg-6 d-flex justify-content-center align-items-center">

                <div class="signup-card">

                    <div class="text-center mb-4">

                        <div class="icon-circle">
                            <i class="bi bi-person-plus"></i>
                        </div>

                        <h2>Create Account</h2>

                        <p>Join MediCart Today</p>

                    </div>

                    <form action="{% url 'signup' %}">

                        <!-- Full Name -->

                        <div class="mb-3">

                            <label>Full Name</label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-person"></i>
                                </span>

                                <input type="text" class="form-control" name="username" placeholder="Enter your name">

                            </div>

                        </div>

                        <!-- Mobile Number -->

                        <div class="mb-3">

                            <label>Mobile Number</label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-telephone"></i>
                                </span>

                                <input type="tel" 
                                class="form-control" 
                                name="mobile" 
                                placeholder="Enter mobile number">

                            </div>

                        </div>

                        <!-- Password -->

                        <div class="mb-3">

                            <label>Password</label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-lock"></i>
                                </span>

                                <input type="password" class="form-control" name="password" placeholder="Password">

                            </div>

                        </div>

                        <!-- Confirm Password -->

                        <div class="mb-3">

                            <label>Confirm Password</label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-shield-lock"></i>
                                </span>

                                <input type="password" 
                                class="form-control"
                                placeholder="Confirm Password">

                            </div>

                        </div>
                        <button class="btn signup-btn w-100">
                            <i class="bi bi-person-check-fill"></i>
                            Sign Up
                        </button>

                        <p class="text-center mt-4">

                            Already have an account?

                            <a href="{%url 'getloginpage'%}">Login</a>

                        </p>

                    </form>

                </div>

            </div>

        </div>
    </div>

</body>

</html>
