{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Medicine | MediCart</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{% static 'CSS/update_med.css' %}">

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="update-card">

                <h2 class="text-center mb-4">

                    <i class="bi bi-pencil-square"></i>

                    Update Medicine

                </h2>

                <form action="{% url 'updatemedicine' %}" method="get">


                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <input type="hidden" name="id" value="{{ medicine.id }}">

                            <label class="form-label">Medicine Name</label>

                            <input type="text"
                                   class="form-control"
                                   name="medicine_name"
                                   value="{{ medicine.medicine_name }}">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Company</label>

                            <input type="text"
                                   class="form-control"
                                   name="company"
                                   value="{{ medicine.company }}">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Price</label>

                            <input type="number"
                                   class="form-control"
                                   name="price"
                                   value="{{ medicine.price }}">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Quantity</label>

                            <input type="number"
                                   class="form-control"
                                   name="quantity"
                                   value="{{ medicine.quantity }}">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Manufacturing Date</label>

                            <input type="date"
                                   class="form-control"
                                   name="mfg_date"
                                   value="{{ medicine.mfg_date|date:'Y-m-d' }}">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Expiry Date</label>

                            <input type="date"
                                   class="form-control"
                                   name="exp_date"
                                   value="{{ medicine.exp_date|date:'Y-m-d' }}">

                        </div>

                        <div class="col-12 mb-4">

                            <label class="form-label">Description</label>

                            <textarea class="form-control"
                                      rows="4"
                                      name="description">{{ medicine.description }}</textarea>

                        </div>

                    </div>

                    <div class="text-center">

                        <button type="submit" class="btn btn-update">

                            <i class="bi bi-check-circle"></i>

                            Update Medicine

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
