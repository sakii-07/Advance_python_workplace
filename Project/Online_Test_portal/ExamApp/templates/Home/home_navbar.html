{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamSphere - Online Examination Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{% static 'css/home/home_navbar.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark custom-navbar">

    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold" href="{% url 'gethomepage' %}">
            ExamSphere - Online Examination Portal
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <!-- Navigation Links -->
            <ul class="navbar-nav ms-auto me-4">

                <li class="nav-item">
                    <a class="nav-link active" href="{% url 'gethomepage' %}">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'showallquestion' %}">
                        Question Module
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        User Module
                    </a>
                </li>

            </ul>

            <!-- Profile Dropdown -->
            <div class="dropdown">

                <button class="btn btn-light profile-btn dropdown-toggle"
                        type="button"
                        data-bs-toggle="dropdown">

                    <i class="bi bi-person-circle"></i>
                    {{ request.session.username }}

                </button>

                <ul class="dropdown-menu dropdown-menu-end">

                    <li>
                        <a class="dropdown-item" href="{%url 'getmyprofilepage'%}">
                            <i class="bi bi-person"></i>
                            My Profile
                        </a>
                    </li>

                    <li>
                        <a class="dropdown-item" href="{% url 'getupdateprofilepage'%}">
                            <i class="bi bi-key"></i>
                            Change Password
                        </a>
                    </li>

                    <li><hr class="dropdown-divider"></li>

                    <li>
                        <a class="dropdown-item text-danger" href="{% url 'logout' %}">
                            <i class="bi bi-box-arrow-right"></i>
                            Logout
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </div>

</nav>

{% block content %}
{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
