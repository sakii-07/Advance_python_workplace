{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Examination</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/test/question_page.css' %}">
</head>

<body>

<div class="container box py-5">

    <div class="exam-card">

        <!-- Header -->
        <div class="exam-header d-flex justify-content-between align-items-center">

            <div>
                <h2 class="mb-1">Online Examination</h2>
                <small>Answer all questions carefully</small>
            </div>

            <div class="text-end">
                <h6 class="mb-2">👤 {{request.session.username}}</h6>
                <span class="badge bg-light text-primary fs-6 px-3 py-2">
                    {{question.subject}}
                </span>
            </div>

        </div>

        <!-- Body -->
        <div class="exam-body">

            <div class="d-flex justify-content-between mb-4">

                <h4>
                    Question {{question.qno}}
                </h4>

                <span class="text-muted">
                    Select one correct answer
                </span>

            </div>

            <form method="get">
            

                <input type="hidden" name="qno" value="{{question.qno}}">
                <input type="hidden" name="qtext" value="{{question.qtext}}">
                <input type="hidden" name="subject" value="{{question.subject}}">
                <input type="hidden" name="answer" value="{{question.corr_answer}}">

                <div class="question-box">

                    <h3 class="question-title">
                        Q{{question.qno}}. {{question.qtext}}
                    </h3>

                    <div class="mt-4">

                        <div class="form-check option">
                            <input class="form-check-input" type="radio" name="op" id="op1" value="Option 1">
                            <label class="form-check-label" for="op1">
                                {{question.op1}}
                            </label>
                        </div>

                        <div class="form-check option">
                            <input class="form-check-input" type="radio" name="op" id="op2" value="Option 2">
                            <label class="form-check-label" for="op2">
                                {{question.op2}}
                            </label>
                        </div>

                        <div class="form-check option">
                            <input class="form-check-input" type="radio" name="op" id="op3" value="Option 3">
                            <label class="form-check-label" for="op3">
                                {{question.op3}}
                            </label>
                        </div>

                        <div class="form-check option">
                            <input class="form-check-input" type="radio" name="op" id="op4" value="Option 4">
                            <label class="form-check-label" for="op4">
                                {{question.op4}}
                            </label>
                        </div> 

                    </div>

                </div>

                <div class="row mt-5">

                    <div class="col-md-4 mb-3">
                        <button class="btn btn-outline-primary w-100"
                                formaction="{% url 'previousquestion' %}">
                            ⏮ Previous
                        </button>
                    </div>

                    <div class="col-md-4 mb-3">
                        <button class="btn btn-primary w-100"
                                formaction="{% url 'nextquestion' %}">
                            ⏭ Next
                        </button>
                    </div>

                    <div class="col-md-4 mb-3">
                        <button class="btn btn-danger w-100"
                                formaction="{% url 'endtest' %}">
                            ⏹ End Test
                        </button>
                    </div>

                </div>

            </form>

        </div>

    </div>

</div>
