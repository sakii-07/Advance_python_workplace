{% extends 'Test/test_navbar.html' %}
{% load static %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Subject</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/test/select_subject.css' %}">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<div class="container">

    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow-lg border-0">

                <div class="card-header text-center">

                    <i class="fa-solid fa-book-open fa-3x mb-3"></i>

                    <h2>Select Subject</h2>

                    <p>Choose the subject for your exam</p>

                </div>

                <div class="card-body p-4">

                    <form action="{% url 'starttest' %}" method="get">

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Subject
                            </label>

                            <select name="subject" class="form-select form-select-lg" required>

                                <option value="">
                                    -- Select Subject --
                                </option>

                                {% for subject in subjects %}

                                <option value="{{ subject }}">
                                    {{ subject }}
                                </option>

                                {% endfor %}

                            </select>

                        </div>

                        <button class="btn btn-primary w-100">

                            <i class="fa-solid fa-arrow-right"></i>

                            Continue

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
