{% extends 'Home/home_navbar.html' %}
{% load static %}

{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/user/delete_user.css' %}">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6 col-md-8">

            <div class="card shadow-lg border-0 delete-card">

                <div class="card-header bg-danger text-white text-center py-4">
                    <h2>Delete Account</h2>
                </div>

                <div class="card-body p-5">

                    <h4 class="text-center mb-4">
                        Confirm Account Deletion
                    </h4>

                    <p class="text-center text-muted">
                        Enter your username to permanently delete your account.
                    </p>

                    <form action="#" method="post">

                        {% csrf_token %}

                        <div class="mb-4">
                            <label class="form-label">Username</label>
                            <input type="text"
                                   name="username"
                                   class="form-control"
                                   placeholder="Enter your username"
                                   required>
                        </div>

                        <div class="d-flex justify-content-center gap-3">

                            <button type="submit" class="btn btn-danger px-4">
                                Delete Account
                            </button>

                            <a href="{% url 'gethomepage' %}" class="btn btn-secondary px-4">
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
