{% extends 'Home/home_navbar.html' %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/user/myprofile.css' %}">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-5 col-md-7 col-sm-10">

            <div class="card shadow profile-card overflow-hidden">

                <div class="card-header text-center">
                    <h3 class="mb-0">My Profile</h3>
                </div>

                <div class="card-body">

                    <div class="text-center mb-4">
                        <i class="bi bi-person-circle profile-icon"></i>
                    </div>

                    <table class="table table-borderless">

                        <tr>
                            <th>Username</th>
                            <td>{{ user.username }}</td>
                        </tr>

                        <tr>
                            <th>Password</th>
                            <td>{{ user.password }}</td>
                        </tr>

                        <tr>
                            <th>Mobile</th>
                            <td>{{ user.mobile }}</td>
                        </tr>

                        <tr>
                            <th>Created At</th>
                            <td>{{ user.created_at }}</td>
                        </tr>

                    </table>

                    <div class="text-center mt-4">

                        <a href="{% url 'getupdateprofilepage'%}" class="btn btn-success me-2">
                            Edit Profile
                        </a>

                        <a href="{% url 'getupdateprofilepage'%}" class="btn btn-warning text-white">
                            Change Password
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
