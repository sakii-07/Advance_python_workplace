<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Employee</title>

    <!-- Bootstrap 5.3.7 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .form-container {
            max-width: 750px;
            margin: 50px auto;
        }

        .form-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            background: #0d6efd;
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 15px 15px 0 0 !important;
        }

        .card-header h3 {
            margin: 0;
            font-weight: 600;
        }

        .form-label {
            font-weight: 600;
            color: #333;
        }

        .form-control,
        .form-select {
            height: 45px;
            border-radius: 8px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 5px rgba(13, 110, 253, 0.25);
        }

        .btn-add {
            background-color: #0d6efd;
            color: white;
            padding: 10px 35px;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-add:hover {
            background-color: #0b5ed7;
            color: white;
        }

        .btn-reset {
            padding: 10px 30px;
            border-radius: 8px;
        }

        .required {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container form-container">

        <div class="card form-card">

            <!-- Header -->
            <div class="card-header">
                <h3>Add Employee</h3>
                <p class="mb-0 mt-2">Enter employee information</p>
            </div>

            <!-- Form -->
            <div class="card-body p-4">

                <form method="POST" action="{% url 'addemployee'%}">

                    {% csrf_token %}

                    <div class="row g-4">

                        <!-- Employee Name -->
                        <div class="col-md-6">
                            <label class="form-label">
                                Employee Name <span class="required">*</span>
                            </label>

                            <input type="text"
                                   name="name"
                                   class="form-control"
                                   placeholder="Enter employee name"
                                   required>
                        </div>

                        <!-- Email -->
                        <div class="col-md-6">
                            <label class="form-label">
                                Email <span class="required">*</span>
                            </label>

                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   placeholder="Enter email address"
                                   required>
                        </div>

                        <!-- Mobile -->
                        <div class="col-md-6">
                            <label class="form-label">
                                Mobile Number <span class="required">*</span>
                            </label>

                            <input type="tel"
                                   name="mobile"
                                   class="form-control"
                                   placeholder="Enter mobile number"
                                   pattern="[0-9]{10}"
                                   maxlength="10"
                                   required>
                        </div>

                        <!-- Department -->
                        <div class="col-md-6">
                            <label class="form-label">
                                Department <span class="required">*</span>
                            </label>

                            <select name="department"
                                    class="form-select"
                                    required>

                                <option value="" selected disabled>
                                    Select Department
                                </option>

                                <option value="IT">IT</option>
                                <option value="HR">HR</option>
                                <option value="Finance">Finance</option>
                                <option value="Marketing">Marketing</option>
                                <option value="Sales">Sales</option>
                                <option value="Operations">Operations</option>

                            </select>
                        </div>

                        <!-- Designation -->
                        <div class="col-md-6">
                            <label class="form-label">
                                Designation <span class="required">*</span>
                            </label>

                            <input type="text"
                                   name="designation"
                                   class="form-control"
                                   placeholder="Enter designation"
                                   required>
                        </div>

                        <!-- Salary -->
                        <div class="col-md-6">
                            <label class="form-label">
                                Salary <span class="required">*</span>
                            </label>

                            <input type="number"
                                   name="salary"
                                   class="form-control"
                                   placeholder="Enter salary"
                                   min="0"
                                   step="0.01"
                                   required>
                        </div>

                    </div>

                    <!-- Buttons -->
                    <div class="text-center mt-5">

                        <button type="submit"
                                class="btn btn-add me-2">
                            Add Employee
                        </button>

                        <button type="reset"
                                class="btn btn-secondary btn-reset">
                            Reset
                        </button>

                    </div>

                    <h6 style="color:red; text-align: center;">{{errmsg}}</h6>
                    <h6 style="color:green; text-align: center;">{{msg}}</h6>

                </form>

            </div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
