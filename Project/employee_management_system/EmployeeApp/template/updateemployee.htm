
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Employee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .form-container {
            max-width: 750px;
            margin: 50px auto;
        }

        .form-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            background: #0d6efd;
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 15px 15px 0 0 !important;
        }

        .card-header h3 {
            margin: 0;
            font-weight: 600;
        }

        .form-label {
            font-weight: 600;
            color: #333;
        }

        .form-control,
        .form-select {
            height: 45px;
            border-radius: 8px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 5px rgba(13, 110, 253, 0.25);
        }

        .btn-update {
            background-color: #0d6efd;
            color: white;
            padding: 10px 35px;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-update:hover {
            background-color: #0b5ed7;
            color: white;
        }

        .btn-back {
            padding: 10px 30px;
            border-radius: 8px;
        }

        .required {
            color: red;
        }
    </style>
</head>

<body>

<div class="container form-container">

    <div class="card form-card">

        <!-- Header -->
        <div class="card-header">
            <h3>Update Employee</h3>
        </div>

        <!-- Form -->
        <div class="card-body p-4">

            {% if msg %}
                <div class="alert alert-success">
                    {{ msg }}
                </div>
            {% endif %}

            {% if errmsg %}
                <div class="alert alert-danger">
                    {{ errmsg }}
                </div>
            {% endif %}

            <form method="POST"
                  action="{% url 'updateemployee' employee.empId %}">

                {% csrf_token %}

                <div class="row g-4">

                    <!-- Employee Name -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Employee Name
                            <span class="required">*</span>
                        </label>

                        <input type="text"
                               name="name"
                               class="form-control"
                               value="{{ employee.name }}"
                               placeholder="Enter employee name"
                               required>

                    </div>


                    <!-- Email -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Email
                            <span class="required">*</span>
                        </label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               value="{{ employee.email }}"
                               placeholder="Enter email address"
                               required>

                    </div>


                    <!-- Mobile -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Mobile Number
                            <span class="required">*</span>
                        </label>

                        <input type="tel"
                               name="mobile"
                               class="form-control"
                               value="{{ employee.mobile }}"
                               placeholder="Enter mobile number"
                               pattern="[0-9]{10}"
                               maxlength="10"
                               required>

                    </div>


                    <!-- Department -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Department
                            <span class="required">*</span>
                        </label>

                        <select name="department"
                                class="form-select"
                                required>

                            <option value="IT"
                                {% if employee.department == "IT" %}selected{% endif %}>
                                IT
                            </option>

                            <option value="HR"
                                {% if employee.department == "HR" %}selected{% endif %}>
                                HR
                            </option>

                            <option value="Finance"
                                {% if employee.department == "Finance" %}selected{% endif %}>
                                Finance
                            </option>

                            <option value="Marketing"
                                {% if employee.department == "Marketing" %}selected{% endif %}>
                                Marketing
                            </option>

                            <option value="Sales"
                                {% if employee.department == "Sales" %}selected{% endif %}>
                                Sales
                            </option>

                            <option value="Operations"
                                {% if employee.department == "Operations" %}selected{% endif %}>
                                Operations
                            </option>

                        </select>

                    </div>


                    <!-- Designation -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Designation
                            <span class="required">*</span>
                        </label>

                        <input type="text"
                               name="designation"
                               class="form-control"
                               value="{{ employee.designation }}"
                               placeholder="Enter designation"
                               required>

                    </div>


                    <!-- Salary -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Salary
                            <span class="required">*</span>
                        </label>

                        <input type="number"
                               name="salary"
                               class="form-control"
                               value="{{ employee.salary }}"
                               placeholder="Enter salary"
                               min="0"
                               step="0.01"
                               required>

                    </div>

                </div>


                <!-- Buttons -->
                <div class="text-center mt-5">

                    <button type="submit"
                            class="btn btn-update me-2">
                        Update Employee
                    </button>

                    <a href="{% url 'showemployee' %}"
                       class="btn btn-secondary btn-back">
                        Back
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
